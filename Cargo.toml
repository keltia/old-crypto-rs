[workspace]
members = ["crates/fialka", "crates/kl-7", "crates/sigaba", "cmd/old-crypto"]
resolver = "3"

[package]
name = "old-crypto-rs"
version = "0.11.0"
edition = "2024"
authors = ["Ollivier Robert <roberto@keltia.net>"]
keywords = ["cryptography", "old-crypto", "pen-and-paper", "education", "history"]
repository = "https://github.com/keltia/old-crypto-rs"
license = "MIT"
readme = "README.md"
description = "Rust implementation of my Go module called old-crypto."
documentation = "https://docs.rs/old-crypto-rs"
categories = ["command-line-utilities", "cryptography", "simulation"]

[lints.rust]
linker_messages = "allow"

[[bench]]
name = "helpers"
harness = false

[[bench]]
name = "ciphers"
harness = false

[[bench]]
name = "transposition"
harness = false


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }

[profile.release]
debug = 1

[features]
default = []
dhat-heap = []
dhat-ad-hoc = []

[dependencies]
ahash = "0.8"
crossterm = "0.29"
dhat = "0.3"
eyre = "0.6"
rand = "0.10"
ratatui = "0.30"
smallvec = "1"
thiserror = "2.0"

[dev-dependencies]
divan = "0.1"
fialka = { version = "0.1.0", path = "crates/fialka" }
kl-7 = { version = "0.1.0", path = "crates/kl-7" }
rstest = "0.27"
sigaba = { version = "0.2.0", path = "crates/sigaba" }
