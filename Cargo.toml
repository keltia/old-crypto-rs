[package]
name = "old-crypto-rs"
version = "0.9.0"
edition = "2024"
authors = ["Ollivier Robert <roberto@keltia.net>"]
keywords = ["cryptography", "old-crypto", "pen-and-paper", "education", "history"]
repository = "https://github.com/keltia/old-crypto-rs"
license = "MIT"
readme = "README.md"
description = "Rust implementation of my Go module called old-crypto."
documentation = "https://docs.rs/cipher-rs"
categories = ["command-line-utilities", "cryptography"]

[[bench]]
name = "helpers"
harness = false

[[bench]]
name = "ciphers"
harness = false

[[bench]]
name = "transposition"
harness = false

[[bin]]
name = "old-crypto"
path = "cmd/old-crypto/main.rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }

[profile.release]
debug = 1

[features]
default = []
fialka = []
sigaba = []
dhat-heap = []
dhat-ad-hoc = []

[dependencies]
ahash = "0.8"
crossterm = "0.29"
dhat = "0.3"
eyre = "0.6.12"
rand = "0.10"
ratatui = "0.30"
smallvec = "1"
thiserror = "2.0"

[dev-dependencies]
divan = "0.1"
rstest = "0.26"

