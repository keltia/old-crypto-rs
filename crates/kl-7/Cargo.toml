[package]
name = "kl-7"
version = "0.1.0"
edition = "2024"
authors = ["Ollivier Robert <roberto@keltia.net>"]
description = "A typed simulation of the TSEC/KL-7 (ADONIS / POLLUX) cipher machine."
repository = "https://github.com/keltia/old-crypto-rs"
license = "MIT"
readme = "README.md"
keywords = ["cryptography", "kl-7", "kl7", "cipher", "history"]
categories = ["cryptography"]
default-run = "kl7ctl"

[lints.rust]
linker_messages = "allow"

[[bin]]
name = "kl7ctl"
path = "cmd/kl7ctl/main.rs"

[[bench]]
name = "kl7"
harness = false

[dependencies]
thiserror = "2.0"
clap = { version = "4.6", features = ["derive"] }
noyalib = "0.0"
old-crypto-rs = { version = "0", path = "../..", default-features = false }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
divan = "0.1"
