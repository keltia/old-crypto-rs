[package]
name = "old-crypto-tui"
version = "0.11.0"
edition = "2024"
authors = ["Ollivier Robert <roberto@keltia.net>"]
license = "MIT"
description = "TUI client for old-crypto-rs and historical cipher machines."
default-run = "old-crypto-tui"

[[bin]]
name = "old-crypto-tui"
path = "main.rs"

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
old-crypto-rs = { version = "0", path = "../.." }
fialka = { version = "0", path = "../fialka" }
kl-7 = { version = "0", path = "../kl-7" }
m209 = { version = "0", path = "../m209" }
purple = { version = "0", path = "../purple" }
sigaba = { version = "0", path = "../sigaba" }
