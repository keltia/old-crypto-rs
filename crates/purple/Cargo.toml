[package]
name = "purple"
version = "0.1.0"
edition = "2024"
authors = ["Ollivier Robert <roberto@keltia.net>"]
description = "A simulation of the Japanese PURPLE (Angooki Taipu B) cipher machine."
repository = "https://github.com/keltia/old-crypto-rs"
license = "MIT"
readme = "README.md"
keywords = ["cryptography", "purple", "cipher", "history"]
categories = ["cryptography"]

[[bin]]
name = "purplectl"
path = "cmd/purplectl/main.rs"

[lints.rust]
linker_messages = "allow"

[dependencies]
old-crypto-rs = { version = "0.11.0", path = "../..", default-features = false }
clap = { version = "4.6", features = ["derive"] }
noyalib = "0.0"
serde = { version = "1", features = ["derive"] }
