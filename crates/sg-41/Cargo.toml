[package]
name = "sg-41"
version = "0.1.0"
edition = "2024"
authors = ["Ollivier Robert <roberto@keltia.net>"]
description = "Historical reconstruction of the SG-41 pin-wheel cipher machine."
repository = "https://github.com/keltia/old-crypto-rs"
license = "MIT"
readme = "README.md"
keywords = ["cryptography", "sg41", "cipher", "history"]
categories = ["cryptography"]

[dependencies]
thiserror = "2.0"
old-crypto-rs = { path = "../..", version = "0" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
noyalib = "0.0"

[[bin]]
name = "sg41ctl"
path = "cmd/sg41ctl/main.rs"
