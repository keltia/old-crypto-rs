[package]
name = "sigaba"
version = "0.2.0"
edition = "2024"
authors = ["Ollivier Robert <roberto@keltia.net>"]
description = "A typed simulation of the SIGABA (ECM Mark II) cipher machine."
repository = "https://github.com/keltia/old-crypto-rs"
license = "MIT"
readme = "README.md"
keywords = ["cryptography", "sigaba", "cipher", "history"]
categories = ["cryptography"]
default-run = "sigabactl"

[lints.rust]
linker_messages = "allow"

[[bin]]
name = "sigabactl"
path = "cmd/sigabactl/main.rs"

[[bench]]
name = "sigaba"
harness = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
noyalib = "0.0"
old-crypto-rs = { version = "0", path = "../..", default-features = false }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
divan = "0.1"
