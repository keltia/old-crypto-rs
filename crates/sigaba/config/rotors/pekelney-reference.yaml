# SIGABA rotor wiring dataset used by the Pekelney/Dunn reference simulator.
#
# The ten 26-contact large-rotor wirings were created for simulator
# interoperability and are not claimed to be historical US wartime wirings.
# The five 10-contact index-rotor wirings were documented from surviving
# SIGABA index rotors.

schema_version: 1
name: pekelney_reference
description: Pekelney/Dunn simulator reference wiring

